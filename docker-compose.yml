version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: unnati-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unnati
    ports:
      - '5432:5432'
    volumes:
      - unnati-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: unnati-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - unnati-redisdata:/data

volumes:
  unnati-pgdata:
  unnati-redisdata:
